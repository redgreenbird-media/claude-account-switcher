name: release
# Tag vX.Y.Z -> Windows setup (NSIS) of the Claude Accounts app plus the Claude Code mod as a plugin zip, attached to a
# GitHub release. This repository is public, and our self-hosted runners do not take jobs of public repositories, so
# the build runs on a GitHub-hosted runner (free for public repositories). The update-server repository's
# claude-accounts workflow picks up the release (only one created by this workflow) and publishes its files on
# https://updates.redgreenbird.com, where Roost lists and updates them. Tags with a dash (v1.2.0-beta.1) become a
# prerelease and go to the beta channel. "Run workflow" builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Tag, VERSION, Cargo.toml and plugin.json agree
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          grep -q "^version = \"$v\"" src-tauri/Cargo.toml || { echo "::error::Cargo.toml version != VERSION ($v)"; exit 1; }
          grep -q "\"version\": \"$v\"" .claude-plugin/plugin.json || { echo "::error::plugin.json version != VERSION ($v)"; exit 1; }
          if [[ $GITHUB_REF == refs/tags/* ]]; then test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag != VERSION"; exit 1; }; fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows setup (NSIS)
        run: npx tauri build --bundles nsis
      - name: Plugin zip and icon
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist plugin/hooks plugin/types plugin/.claude-plugin
          cp .claude-plugin/plugin.json plugin/.claude-plugin/
          cp hooks/hooks.json hooks/register.tsx plugin/hooks/
          cp types/index.d.ts plugin/types/
          (cd plugin && 7z a -tzip -bso0 "../dist/account-switcher-plugin-$v.zip" .)
          cp src-tauri/target/release/bundle/nsis/*.exe dist/
          cp assets/icon.png dist/icon.png
          ls -la dist
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/icon.png
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
