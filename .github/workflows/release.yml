name: release
# Tag vX.Y.Z -> Windows setup (NSIS) of the Claude Accounts app plus the Claude Code mod as a plugin zip;
# the publish job puts both on https://updates.redgreenbird.com (Roost lists and updates them) and creates
# the GitHub release. Tags with a dash (v1.2.0-beta.1) go to the beta channel. "Run workflow" builds without
# publishing; the files are attached to the run as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, VERSION, Cargo.toml and plugin.json agree
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          grep -q "^version = \"$v\"" src-tauri/Cargo.toml || { echo "::error::Cargo.toml version != VERSION ($v)"; exit 1; }
          grep -q "\"version\": \"$v\"" .claude-plugin/plugin.json || { echo "::error::plugin.json version != VERSION ($v)"; exit 1; }
          if [[ $GITHUB_REF == refs/tags/* ]]; then test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag != VERSION"; exit 1; }; fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles nsis
      - name: Plugin zip and icon
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist, plugin/hooks, plugin/types, plugin/.claude-plugin | Out-Null
          Copy-Item .claude-plugin/plugin.json plugin/.claude-plugin/
          Copy-Item hooks/hooks.json, hooks/register.tsx plugin/hooks/
          Copy-Item types/index.d.ts plugin/types/
          Compress-Archive -Path plugin/* -DestinationPath "dist/account-switcher-plugin-$v.zip"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) dist/
          Copy-Item assets/icon.png dist/icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: [self-hosted, update-server]
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows, path: dist }
      - uses: redgreenbird-media/update-server/.github/actions/publish@main
        with:
          app: claude-accounts
          version: ${{ github.ref_name }}
          channel: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
          title: Claude Accounts
          description: Claude-Desktop-Accounts im Tray wechseln, 5h- und Wochenlimit aller Accounts sehen.
          icon: dist/icon.png
          files: dist/*.exe
      - uses: redgreenbird-media/update-server/.github/actions/publish@main
        with:
          app: plugin-account-switcher
          kind: plugin
          version: ${{ github.ref_name }}
          channel: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
          title: Account Switcher (Claude Code)
          description: Zeigt Account und Limits über dem Prompt, /accounts-Panel; schreibt die Limits für die App Claude Accounts.
          files: dist/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true